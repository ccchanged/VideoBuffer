name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-rust:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/replay_core/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/replay_core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run Rust tests
        working-directory: rust/replay_core
        run: cargo test --lib

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test-rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Set NDK path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/replay_core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/replay_core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Rust native library
        working-directory: rust/replay_core
        run: cargo ndk -t arm64-v8a -o ../../app/src/main/jniLibs build --release

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version=8.9

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: instant-replay-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: instant-replay-release
          path: app/build/outputs/apk/release/*.apk
